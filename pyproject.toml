[project]
name = "ferrehogar-pos"
version = "0.1.0"
description = "Punto de Venta minimalista para ferretería con conversión BCV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.85.1",
    "flet-web>=0.85.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pybcv>=1.1.2",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferrehogar_pos"]

[tool.uv]
package = true

[project.scripts]
ferrehogar-pos = "ferrehogar_pos.main:ejecutar_pos"
ferrehogar-debug = "ferrehogar_pos.debug:debug"